<svg xmlns="http://www.w3.org/2000/svg" viewBox="-100 -100 200 200" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- カザグルマの羽根1枚ぶん。これを90度ずつ回して4枚並べています -->
  <defs>
    <g id="blade">
      <path d="M0 0 L0 -92 L64 -64 Z"/>
      <path d="M0 0 L64 -64 L42 -6 Z" fill="#4DB6EA"/>
    </g>
  </defs>
  <g fill="#FFFFFF"><use href="#blade"/></g>
  <g fill="#E3F6FF" transform="rotate(90)"><use href="#blade"/></g>
  <g fill="#FFFFFF" transform="rotate(180)"><use href="#blade"/></g>
  <g fill="#E3F6FF" transform="rotate(270)"><use href="#blade"/></g>
  <circle r="9" fill="#1B2B3A"/>
  <circle r="3.5" fill="#FFFFFF"/>
</svg>
